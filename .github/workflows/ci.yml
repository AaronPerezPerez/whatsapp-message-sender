name: CI

on:
  push:
    branches: [main, develop]
    # Solo en push: en pull_request haria que un PR de solo docs nunca
    # reportase el check y se quedase bloqueado si es obligatorio.
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - ".idea/**"
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # El core no toca Puppeteer, asi que no hace falta bajar Chromium (~150MB).
  PUPPETEER_SKIP_DOWNLOAD: "true"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci --prefer-offline

      # `!cancelled()` para ver todos los fallos en un solo run en vez de
      # arreglar-pushear-descubrir-el-siguiente.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        if: "!cancelled()"
        run: npm run typecheck

      - name: Test
        if: "!cancelled()"
        run: npm test
